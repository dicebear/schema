[package]
name = "dicebear-schema"
version = "1.5.0-rc.1"
edition = "2021"
description = "JSON Schema definitions for DiceBear avatar styles and options"
license = "MIT"
repository = "https://github.com/dicebear/schema"
homepage = "https://www.dicebear.com"
keywords = ["dicebear", "avatar", "schema", "json-schema"]
authors = ["Florian Körner <contact@florian-koerner.com>"]
readme = "README.md"

# Pure-data crate: ship the source schemas (committed `src/`, not the gitignored,
# npm-only `dist/`) plus the thin re-export shim. `cargo publish` bundles only
# files under the package root, so the JSON must live here — which it does.
include = ["/src/*.json", "/schema.rs", "/LICENSE", "/README.md"]

[lib]
# `src/` holds the JSON data, so the crate root can't be the default `src/lib.rs`;
# the shim lives at the repo root as `schema.rs`, next to the Go shim `schema.go`.
path = "schema.rs"
