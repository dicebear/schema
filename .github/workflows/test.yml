name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  go:
    runs-on: ubuntu-latest
    # schema.go is static (only two schemas, no codegen), so there is no drift
    # check — just confirm the module builds and the embeds resolve.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

  dart:
    runs-on: ubuntu-latest
    # Unlike schema.rs/schema.go, the Dart shim must embed the JSON as string
    # literals (Dart has no include_str!/go:embed), so lib/dicebear_schema.dart
    # is generated from src/*.json by scripts/build.sh and git-ignored, like the
    # minified npm dist/. Only the pub.dev publish ships it, built fresh, so
    # there is no drift to check. Generate it here, then prove every embedded
    # constant is byte-identical to its src/ JSON (this guards the generator's
    # string escaping) and that the package analyzes cleanly.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Generate lib/ from src/
        run: bash scripts/build.sh

      - name: Analyze
        run: |
          dart pub get
          dart analyze --fatal-infos

      - name: Verify byte parity with src/
        run: dart run tool/check_parity.dart

  csharp:
    runs-on: ubuntu-latest
    # MSBuild embeds src/*.json into the assembly verbatim, so unlike the Dart
    # shim there is nothing generated and no escaping to guard. What can still
    # break is the wiring: a renamed file, or a LogicalName that no longer
    # matches what schema.cs looks up. The tool builds the package, reads both
    # schemas back out and compares them to src/.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build DiceBear.Schema.csproj --configuration Release

      - name: Verify byte parity with src/
        run: dotnet run --project tool/CheckParity

      - name: Pack
        # dotnet build leaves the packaging inputs unresolved, so a Pack item
        # pointing at a missing file (LICENSE, README.md) stays invisible until
        # the release packs, by which point npm is already published. Packing
        # here turns that into a red pull request instead.
        run: dotnet pack DiceBear.Schema.csproj --configuration Release --output dist-nuget
