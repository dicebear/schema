name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  go:
    runs-on: ubuntu-latest
    # schema.go is static (only two schemas, no codegen), so there is no drift
    # check — just confirm the module builds and the embeds resolve.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...

  dart:
    runs-on: ubuntu-latest
    # Unlike schema.rs/schema.go, the Dart shim must embed the JSON as string
    # literals (Dart has no include_str!/go:embed), so lib/dicebear_schema.dart
    # is generated from src/*.json by scripts/build.sh and git-ignored, like the
    # minified npm dist/. Only the pub.dev publish ships it, built fresh, so
    # there is no drift to check. Generate it here, then prove every embedded
    # constant is byte-identical to its src/ JSON (this guards the generator's
    # string escaping) and that the package analyzes cleanly.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Generate lib/ from src/
        run: bash scripts/build.sh

      - name: Analyze
        run: |
          dart pub get
          dart analyze --fatal-infos

      - name: Verify byte parity with src/
        run: dart run tool/check_parity.dart
