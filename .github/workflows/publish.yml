name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: bash scripts/build.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --provenance

  publish-pypi:
    runs-on: ubuntu-latest
    # Runs after the npm job so the shared schema tests have passed before
    # anything is pushed to PyPI.
    needs: publish
    permissions:
      contents: read # actions/checkout (a permissions block defaults the rest to none)
      id-token: write # Trusted Publishing to PyPI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        # Build into a dedicated directory so the wheel/sdist never mix with the
        # npm `dist/` (which holds the minified *.min.json).
        run: pipx run build --outdir dist-python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python
